	<style>
		.tm-actions {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			align-items: center;
			margin: 10px 0 16px;
		}
		.tm-row {
			margin: 8px 0;
			word-break: break-all;
		}
		.tm-muted {
			color: #666;
		}
		.tm-mail-list {
			list-style: none;
			padding: 0;
			margin: 0;
			border: 1px solid #ddd;
			border-radius: 6px;
			overflow: hidden;
		}
		.tm-mail-list li {
			padding: 10px 12px;
			border-bottom: 1px solid #eee;
			cursor: pointer;
			background: #fff;
		}
		.tm-mail-list li:last-child {
			border-bottom: none;
		}
		.tm-mail-list li:hover {
			background: #f7f9ff;
		}
		.tm-subject {
			font-weight: 700;
		}
		.tm-small {
			font-size: 12px;
		}
		.tm-card {
			border: 1px solid #ddd;
			border-radius: 6px;
			padding: 12px;
			margin-top: 12px;
			background: #fff;
		}
		.tm-html-preview {
			border: 1px solid #e5e5e5;
			border-radius: 4px;
			padding: 10px;
			max-height: 320px;
			overflow: auto;
			background: #fafafa;
		}
	</style>

<body>
	<div class="maincard">
		<h2><a class="logo" href="/">Txto</a></h2>
		<p>一次性临时邮箱。默认有效期 10 分钟，可在部署端配置。</p>

		<div class="tm-actions">
			<button type="button" id="create-mail-btn">创建临时邮箱</button>
			<button type="button" id="stop-poll-btn" disabled>停止轮询</button>
		</div>

		<div class="tm-row"><strong>邮箱地址：</strong><span id="mail-address">未创建</span></div>
		<div class="tm-row"><strong>剩余时间：</strong><span id="mail-countdown">--</span></div>
		<div class="tm-row tm-muted" id="mail-status">点击“创建临时邮箱”开始</div>

		<h3>收件箱</h3>
		<ul id="mail-list" class="tm-mail-list">
			<li class="tm-muted">暂无邮件</li>
		</ul>

		<div id="mail-detail" class="tm-card" style="display: none;">
			<div class="tm-row"><strong>From:</strong> <span id="detail-from"></span></div>
			<div class="tm-row"><strong>Subject:</strong> <span id="detail-subject"></span></div>
			<div class="tm-row tm-small tm-muted"><strong>Time:</strong> <span id="detail-time"></span></div>
			<div class="tm-row"><strong>Text:</strong></div>
			<pre id="detail-body" class="tm-html-preview"></pre>
			<div class="tm-row"><strong>HTML:</strong></div>
			<div id="detail-html" class="tm-html-preview"></div>
		</div>
	</div>
</body>
