<body>
	<div class="maincard">
		<h2><a class="logo" href="/">Txto</a></h2>
		<p>Disposable temporary mailbox. Default validity is 10 minutes and can be configured on the server.</p>

		<div class="tm-actions">
			<button type="button" id="create-mail-btn">Create Temporary Mailbox</button>
			<button type="button" id="stop-poll-btn" disabled>Stop Polling</button>
		</div>

		<div class="tm-row">
			<strong>Email Address:</strong>
			<span id="mail-address">Not created</span>
			<button type="button" id="copy-mail-btn" class="tm-copy-btn" disabled>Copy</button>
		</div>
		<div class="tm-row"><strong>Remaining Time:</strong><span id="mail-countdown" class="tm-countdown">--:--</span></div>
		<div class="tm-row tm-muted" id="mail-status">Click "Create Temporary Mailbox" to start</div>

		<h3>Inbox</h3>
		<ul id="mail-list" class="tm-mail-list">
			<li class="tm-muted">No messages yet</li>
		</ul>

		<div id="mail-detail" class="tm-card" style="display: none;">
			<div class="tm-row"><strong>From:</strong> <span id="detail-from"></span></div>
			<div class="tm-row"><strong>Subject:</strong> <span id="detail-subject"></span></div>
			<div class="tm-row tm-small tm-muted"><strong>Time:</strong> <span id="detail-time"></span></div>
			<div class="tm-row"><strong>Text:</strong></div>
			<pre id="detail-body" class="tm-html-preview"></pre>
			<div class="tm-row"><strong>HTML:</strong></div>
			<div id="detail-html" class="tm-html-preview"></div>
		</div>
	</div>

<script>
	(function () {
		const copyBtn = document.getElementById('copy-mail-btn');
		const mailAddressEl = document.getElementById('mail-address');
		const mailStatusEl = document.getElementById('mail-status');
		if (!copyBtn || !mailAddressEl) return;

		function getMailAddress() {
			return (mailAddressEl.textContent || '').trim();
		}

		function canCopy(address) {
			return !!address && address !== 'Not created';
		}

		function updateCopyButtonState() {
			copyBtn.disabled = !canCopy(getMailAddress());
		}

		async function copyText(text) {
			if (navigator.clipboard && navigator.clipboard.writeText) {
				await navigator.clipboard.writeText(text);
				return;
			}
			const helper = document.createElement('textarea');
			helper.value = text;
			helper.setAttribute('readonly', '');
			helper.style.position = 'fixed';
			helper.style.opacity = '0';
			document.body.appendChild(helper);
			helper.select();
			document.execCommand('copy');
			document.body.removeChild(helper);
		}

		copyBtn.addEventListener('click', async function () {
			const address = getMailAddress();
			if (!canCopy(address)) return;
			try {
				await copyText(address);
				if (mailStatusEl) {
					mailStatusEl.textContent = 'Email copied to clipboard.';
				}
			} catch (err) {
				if (mailStatusEl) {
					mailStatusEl.textContent = 'Copy failed. Please copy manually.';
				}
			}
		});

		const observer = new MutationObserver(updateCopyButtonState);
		observer.observe(mailAddressEl, { childList: true, characterData: true, subtree: true });
		updateCopyButtonState();
	})();
</script>
